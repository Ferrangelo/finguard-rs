services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: finguard_rs-backend:test
    container_name: finguard_rs-backend_test
    network_mode: host
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # The image binds 0.0.0.0 by default. On the host network that would expose
      # the API, which has no login, to the LAN.
      FINGUARD_HOST: "127.0.0.1"
      FINGUARD_PORT: "${FINGUARD_PORT:-3111}"
      FINGUARD_SYNC_PORT: "${FINGUARD_SYNC_PORT:-3112}"
      # OVERRIDE the Dockerfile XDG defaults here:
      XDG_DATA_HOME: "/data"
      XDG_CONFIG_HOME: "/config" 
    # FINGUARD_DATA_DIR and FINGUARD_CONFIG_DIR pin the host paths. The ${HOME}
    # fallback expands in the environment of the process that runs compose, so under
    # sudo it becomes /root, which the desktop user cannot read.
    volumes:
      - "${FINGUARD_DATA_DIR:-${HOME}/.local/share/finguard}:/data/finguard"
      - "${FINGUARD_CONFIG_DIR:-${HOME}/.config/finguard}:/config/finguard"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finguard_rs-frontend
    network_mode: host
    # The image's default command (`npm run dev -- --host`) listens on every
    # interface, and that CLI flag overrides FINGUARD_DEV_HOST in vite.config.ts.
    # On the host network an all-interfaces bind would put the dev server, which
    # has no login, on the LAN.
    command: ["npm", "run", "dev", "--", "--host", "127.0.0.1"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://127.0.0.1:${FINGUARD_PORT:-3111}
    restart: unless-stopped

volumes:
  finguard_data:
  finguard_config:
