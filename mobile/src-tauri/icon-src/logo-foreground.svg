<svg width="432" height="432" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <!-- Android adaptive icon foreground on the 108dp canvas. The navy background is
       the ic_launcher_background color, so it is not drawn here. The group holds the
       logo artwork in its 512 unit coordinates, scaled by 0.105 and centered on
       (54, 54): the artwork spans about 31 to 77 on both axes, so every point stays
       inside the 66dp safe circle (radius 33) that no launcher mask clips. -->
  <g transform="translate(24.34 28.54) scale(0.105)">
    <rect x="64" y="294" width="88" height="170" rx="14" fill="#5C6B8A"/>
    <rect x="176" y="214" width="88" height="250" rx="14" fill="#2F8F7B"/>
    <rect x="288" y="124" width="88" height="340" rx="14" fill="#E3B23C"/>

    <circle cx="372" cy="150" r="124" fill="#F7F4EE"/>
    <circle cx="372" cy="150" r="124" fill="none" stroke="#E3B23C" stroke-width="10"/>
    <text x="372" y="192" font-family="Georgia, 'Times New Roman', FreeSerif, serif" font-size="130" font-weight="700" fill="#1B2A4A" text-anchor="middle">€</text>
  </g>
</svg>
