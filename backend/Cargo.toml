[package]
name = "finguard_rs_backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "finguard_rs_backend"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
indexmap = { version = "2.7", features = ["serde"] }
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
polars = { version = "0.54", default-features = false, features = [
    "parquet",
    "fmt",
    "lazy",
    "dtype-date",
    "round_series",
    "is_in",
    "strings",
    "regex",
    "concat_str",
    "diagonal_concat",
    "temporal",
] }
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
uuid = { version = "1", features = ["v4"] }
# Sync transport: the Noise protocol for the encrypted channel, and SPAKE2
# to turn the 6-digit pairing code into the key of the pairing handshake.
# Exact pins, because a crypto crate update is a decision, not a refresh.
snow = "=0.10.0"
spake2 = "=0.4.0"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
